<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Pizza Delivery Rush</title>
  </head>

  <body>
    <div class="container">
      <h1>Pizza Delivery Rush</h1>

      <div class="section">
        <div class="delivery">
          <button id="pepperoni-button" value="pepperoni">Deliver!</button>
          <div class="track">
            <img id="pepperoni-scooter" src="https://image.similarpng.com/file/similarpng/original-picture/2022/03/Pepperoni-Pizza-on-transparent-background-PNG.png" alt="pepperoni scooter" />
          </div>
        </div>

        <div class="delivery">
          <button id="veggie-button" value="veggie">Deliver!</button>
          <div class="track">
            <img id="veggie-scooter" src="https://png.pngtree.com/png-clipart/20240730/original/pngtree-tasty-veggie-pizza-png-image_15667124.png" alt="veggie scooter" />
          </div>
        </div>

        <div class="delivery">
          <button id="bbq-button" value="bbq">Deliver!</button>
          <div class="track">
            <img id="bbq-scooter" src="https://static.vecteezy.com/system/resources/previews/055/299/634/non_2x/delicious-bbq-chicken-pizza-on-transparent-background-png.png" alt="bbq scooter" />
          </div>
        </div>
      </div>

      <div id="winner"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
